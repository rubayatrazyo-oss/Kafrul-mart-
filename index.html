<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafrul Mart - Grocery & Essentials</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; }
        header { background-color: #008080; color: #fff; padding: 1.5rem; text-align: center; }
        nav { background: #333; color: #fff; padding: 0.5rem; text-align: center; }
        nav a { color: #fff; margin: 0 1rem; text-decoration: none; }
        .container { padding: 2rem; max-width: 1200px; margin: auto; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        .product-card { background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card h3 { margin: 1rem 0 0.5rem; }
        .product-card .price { font-size: 1.2rem; color: #008080; margin-bottom: 1rem; }
        .product-card button { background-color: #008080; color: #fff; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
        footer { background-color: #333; color: #fff; text-align: center; padding: 1rem; margin-top: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>Kafrul Mart - Grocery & Essentials</h1>
        <p>Welcome to your favorite online store.</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <h2>Our Products</h2>
        <div class="product-grid">
            <div class="product-card">
                <h3>Fresh Apples</h3>
                <p class="price">$2.99 / kg</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Organic Milk</h3>
                <p class="price">$1.99 / liter</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <h3>Whole Wheat Bread</h3>
                <p class="price">$1.50</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Kafrul Mart. All rights reserved.</p>
    </footer>
</body>
</html>
